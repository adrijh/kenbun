# On a version tag (git tag v0.1.0 && git push --tags): test, then publish the
# binaries as a GitHub Release and the image to ghcr.io, both as that version,
# so a released `kenbun k8s deploy` pulls its own image.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  packages: write # push the image

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # VERSION comes from git describe

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: make test

      - run: make dist

      # The Dockerfile cross-compiles in its build stage, so no QEMU.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: make push

      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
