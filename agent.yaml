# `kenbun agent`: the eBPF profiler on a k8s node, pushing to kenbun. Embedded
# into the binary; main.go adds the profiler settings and the --to endpoint.
# k8s_attributes sets service.name (and k8s.*) per the semantic conventions,
# matching samples to pods by container.id. Processes outside pods keep their
# executable name.
receivers:
  profiling:

processors:
  # The last guard: past the soft limit, profiles are dropped at the receiver.
  # Percentages of the container's memory limit.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  # Off-CPU samples outside asyncio loops, which kenbun drops on arrival:
  # machine-wide nearly all of a batch's samples.
  kenbun_offcpu:
  k8s_attributes:
    filter:
      node_from_env_var: KUBE_NODE_NAME # only pods on this node
    extract:
      otel_annotations: true
      metadata:
        - service.namespace
        - service.name
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.container.name
        - container.id
    pod_association:
      - sources:
          - from: resource_attribute
            name: container.id

exporters:
  otlp_grpc:
    endpoint: kenbun.kenbun.svc:4317
    tls:
      insecure: true
    # One batch in flight per node (default 10): after a kenbun restart every
    # node flushes its queue at once, and 10 x nodes batches OOMed it.
    # Bounded in bytes (default: 1000 batches, ~3GB): while kenbun is down
    # (a redeploy) it keeps a minute or two and drops the rest, instead of
    # OOMing the agent. Queued batches take ~10x their encoded size in memory.
    sending_queue:
      num_consumers: 1
      sizer: bytes
      queue_size: 4194304 # 4MiB encoded, ~40MiB in memory

service:
  pipelines:
    profiles:
      receivers: [profiling]
      processors: [memory_limiter, kenbun_offcpu, k8s_attributes]
      exporters: [otlp_grpc]
  telemetry:
    metrics:
      level: none # no self-metrics endpoint on :8888
