# `kenbun agent`: the eBPF profiler on a k8s node, pushing to kenbun. Embedded
# into the binary; main.go adds the profiler settings and the --to endpoint.
# k8s_attributes sets service.name (and k8s.*) per the semantic conventions,
# matching samples to pods by container.id. Processes outside pods keep their
# executable name.
receivers:
  profiling:

processors:
  k8s_attributes:
    filter:
      node_from_env_var: KUBE_NODE_NAME # only pods on this node
    extract:
      otel_annotations: true
      metadata:
        - service.namespace
        - service.name
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.container.name
        - container.id
    pod_association:
      - sources:
          - from: resource_attribute
            name: container.id

exporters:
  otlp_grpc:
    endpoint: kenbun.kenbun.svc:4317
    tls:
      insecure: true

service:
  pipelines:
    profiles:
      receivers: [profiling]
      processors: [k8s_attributes]
      exporters: [otlp_grpc]
  telemetry:
    metrics:
      level: none # no self-metrics endpoint on :8888
