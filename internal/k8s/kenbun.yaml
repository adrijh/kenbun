# kenbun serve: receives OTLP profiles on :4317, serves the API on :7070.
# Applied by `kenbun k8s deploy`, which sets the image.
apiVersion: v1
kind: Namespace
metadata:
  name: kenbun
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kenbun
  namespace: kenbun
  labels:
    app.kubernetes.io/name: kenbun
spec:
  replicas: 1 # in-memory store: each replica would hold a slice of the data
  selector:
    matchLabels:
      app.kubernetes.io/name: kenbun
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kenbun
    spec:
      terminationGracePeriodSeconds: 5 # in-memory, nothing to flush
      containers:
        - name: kenbun
          image: kenbun:dev
          imagePullPolicy: IfNotPresent
          args: [serve]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: http
              containerPort: 7070
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: kenbun
  namespace: kenbun
spec:
  selector:
    app.kubernetes.io/name: kenbun
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      appProtocol: grpc
    - name: http
      port: 7070
      targetPort: http
