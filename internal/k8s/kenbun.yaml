# kenbun serve: receives OTLP profiles on :4317, serves the API on :7070.
# Applied by `kenbun k8s deploy`, which sets the image.
apiVersion: v1
kind: Namespace
metadata:
  name: kenbun
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kenbun
  namespace: kenbun
  labels:
    app.kubernetes.io/name: kenbun
spec:
  replicas: 1 # each replica would hold a slice of the data
  selector:
    matchLabels:
      app.kubernetes.io/name: kenbun
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kenbun
    spec:
      terminationGracePeriodSeconds: 5 # SQLite's WAL survives a kill
      containers:
        - name: kenbun
          image: kenbun:dev
          imagePullPolicy: IfNotPresent
          # On disk, not in memory: 30 min of a cluster's profiles outgrow RAM.
          # The emptyDir also keeps them across container restarts.
          args: [serve, --db=/data/kenbun.db]
          env:
            - name: GOMEMLIMIT # Go's own heap; leaves the rest to SQLite's page cache
              value: 800MiB
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: http
              containerPort: 7070
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 5Gi # ~2.5Gi for 30 min; deleted rows' space is reused
---
apiVersion: v1
kind: Service
metadata:
  name: kenbun
  namespace: kenbun
spec:
  selector:
    app.kubernetes.io/name: kenbun
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      appProtocol: grpc
    - name: http
      port: 7070
      targetPort: http
