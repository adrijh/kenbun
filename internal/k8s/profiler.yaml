# The eBPF profiler on every node (`kenbun agent`, config in agent.yaml),
# pushing to kenbun. `kenbun k8s deploy` sets the image: the same as kenbun's,
# so the profiles proto (Alpha) always matches.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kenbun-profiler
  namespace: kenbun
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kenbun-profiler
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, watch, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kenbun-profiler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kenbun-profiler
subjects:
  - kind: ServiceAccount
    name: kenbun-profiler
    namespace: kenbun
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kenbun-profiler
  namespace: kenbun
  labels:
    app.kubernetes.io/name: kenbun-profiler
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kenbun-profiler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kenbun-profiler
    spec:
      serviceAccountName: kenbun-profiler
      terminationGracePeriodSeconds: 5
      hostPID: true # eBPF reports host PIDs; /proc must match
      containers:
        - name: profiler
          image: kenbun:dev
          imagePullPolicy: IfNotPresent
          args: [agent, --to=kenbun.kenbun.svc:4317]
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            runAsUser: 0 # the image's default user is nonroot; eBPF needs root
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: sys-kernel # debugfs and tracefs
              mountPath: /sys/kernel
              readOnly: true
      volumes:
        - name: sys-kernel
          hostPath:
            path: /sys/kernel
