# Example sender: the OpenTelemetry eBPF profiler on every node, pushing to kenbun.
# k8s_attributes sets service.name (and k8s.*) per the semantic conventions,
# matching samples to pods by container.id. Processes outside pods keep their
# executable name.
#
# `kenbun k8s deploy` sets the image version to the collector version kenbun
# is built with: the profiles proto is Alpha and changes between releases.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kenbun-profiler
  namespace: kenbun
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kenbun-profiler
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, watch, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kenbun-profiler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kenbun-profiler
subjects:
  - kind: ServiceAccount
    name: kenbun-profiler
    namespace: kenbun
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kenbun-profiler
  namespace: kenbun
data:
  config.yaml: |
    receivers:
      profiling:
        samples_per_second: 97

    processors:
      k8s_attributes:
        filter:
          node_from_env_var: KUBE_NODE_NAME # only pods on this node
        extract:
          otel_annotations: true
          metadata:
            - service.namespace
            - service.name
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - container.id
        pod_association:
          - sources:
              - from: resource_attribute
                name: container.id

    exporters:
      otlp_grpc:
        endpoint: kenbun.kenbun.svc:4317
        tls:
          insecure: true

    service:
      pipelines:
        profiles:
          receivers: [profiling]
          processors: [k8s_attributes]
          exporters: [otlp_grpc]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kenbun-profiler
  namespace: kenbun
  labels:
    app.kubernetes.io/name: kenbun-profiler
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kenbun-profiler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kenbun-profiler
    spec:
      serviceAccountName: kenbun-profiler
      terminationGracePeriodSeconds: 5
      hostPID: true # eBPF reports host PIDs; /proc must match
      containers:
        - name: profiler
          image: otel/opentelemetry-collector-ebpf-profiler:0.162.0
          args:
            - --config=/etc/otelcol/config.yaml
            - --feature-gates=service.profilesSupport
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
            - name: sys-kernel # debugfs and tracefs
              mountPath: /sys/kernel
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kenbun-profiler
        - name: sys-kernel
          hostPath:
            path: /sys/kernel
